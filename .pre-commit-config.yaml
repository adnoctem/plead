# ref: https://github.com/pre-commit/pre-commit/issues/1930
# default_language_version:
#   ruby: 3.2.1
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        exclude: ^CHANGELOG\.md$
        args:
          - "-c"
          - ".github/linters/.markdown-lint.yml"

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.2
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      # Run the linter.
      - id: zizmor
        args:
          - "-c"
          - ".github/linters/zizmor.yaml"

  - repo: https://github.com/crate-ci/typos
    rev: v1.24.6
    hooks:
      - id: typos
        exclude: (.*\.yaml|.*rc$|^CHANGELOG.md$)

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.3.0
    hooks:
      - id: sqlfluff-lint
        args:
          - "--dialect"
          - "sqlite"
  #      - id: sqlfluff-fix
  #        args:
  #          - "--dialect"
  #          - "sqlite"

  # ref: https://www.checkov.io/4.Integrations/pre-commit.html
  - repo: https://github.com/bridgecrewio/checkov.git
    rev: 3.3.13
    hooks:
      - id: checkov
        args:
          - "--config-file"
          - ".github/linters/.checkov.yaml"
      - id: checkov_diff
        args:
          - "--config-file"
          - ".github/linters/.checkov.yaml"
          - "-f"
  #      - id: checkov_secrets
  #        args:
  #          - "--config-file"
  #          - ".github/linters/.checkov.yaml"

  # Local hooks
  - repo: local
    hooks:
      - id: trivy
        name: Trivy
        entry: trivy fs . --skip-dirs "vendor"
        language: system
        pass_filenames: false

      - id: phpstan
        name: PHPStan
        entry: vendor/bin/phpstan analyze
        language: system
        pass_filenames: false

      - id: php-cs-fixer
        name: PHP-CS-Fixer
        entry: vendor/bin/php-cs-fixer check
        language: system
        pass_filenames: false

      - id: prettier-format
        name: Prettier format
        entry: bun x prettier --write "**/*.md"
        language: system
        pass_filenames: false

      - id: textlint
        name: Textlint
        entry: bun x textlint --config .github/linters/.textlintrc
        language: system
        pass_filenames: false
