name: "Run Super-Linter"

on: ["push", "pull_request"]

permissions: {}

jobs:
  lint:
    name: Super-Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # super-linter needs the full git history to get the
          # list of files that changed across commits
          fetch-depth: 0
          persist-credentials: false

      - name: Superlinter
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STRIP_DEFAULT_WORKSPACE_FOR_REGEX: true
          # vendor/ is untracked but appears in the workspace once super-linter
          # runs `composer install` for the PHP linters; CHANGELOG.md is
          # generated by semantic-release. Both are excluded from linting.
          FILTER_REGEX_EXCLUDE: (^|/)vendor/|^CHANGELOG\.md$
          VALIDATE_PHP: true
          FIX_PHP: false
          # obsolete tools
          VALIDATE_PHP_PHPCS: false
          VALIDATE_PHP_PSALM: false
          VALIDATE_JSCPD: false
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          # reconfiguration
          PHP_PHPSTAN_CONFIG_FILE: ".phpstan.neon"
