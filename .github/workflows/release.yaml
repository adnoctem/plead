name: "Release"

on:
  workflow_dispatch:
  repository_dispatch:
    types: [release]

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

concurrency:
  group: "${{ github.workflow }}@${{ github.ref }}"

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.D4X4_GITHUB_TOKEN }}
    outputs:
      published: ${{ steps.semantic-release.outputs.new_release_published }}
      new_version: ${{ steps.semantic-release.outputs.new_release_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Install PHP with extensions"
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          coverage: none
          extensions: "intl, mbstring, pdo_sqlite, zip, pcntl"
          php-version: 8.5
          tools: composer:v2, box

      - name: Semantic Release
        id: semantic-release
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        with:
          semantic_version: 25
          branches: |
            [
              'main',
              'next'
            ]
          extra_plugins: |
            @semantic-release/changelog@7.0.0
            @semantic-release/exec@7.1.0
            @semantic-release/git@11.0.1
            conventional-changelog-conventionalcommits@10.4.1
