name: 🐞 Bug
description: Create a report to help us improve
labels: ["tech-issues"]
body:
    - type: markdown
      attributes:
          value: |
              Thank you for reporting an issue. Please fill in as much of the following form as you are able.
    - type: input
      attributes:
          label: Name and Version
          description: Name and version of the affected command or tool
          placeholder: plead - 0.1.0
      validations:
          required: true
    - type: dropdown
      attributes:
          label: What PHP version are you using?
          description: The PHP version where the issue occurs
          options:
              - PHP 8.4
              - PHP 8.5
              - PHP 8.6
      validations:
          required: true
    - type: dropdown
      attributes:
          label: What operating system are you using?
          description: The OS where the issue occurs
          options:
              - Linux
              - macOS
              - Windows
      validations:
          required: true
    - type: textarea
      attributes:
          label: What steps will reproduce the bug?
          description: Enter details about your bug.
          placeholder: |
              1. In this environment...
              2. With this config...
              3. Run '...'
              4. See error...
      validations:
          required: true
    - type: textarea
      attributes:
          label: What is the expected behavior?
          description: If possible please provide textual output instead of screenshots.
    - type: textarea
      attributes:
          label: What do you see instead?
          description: If possible please provide textual output instead of screenshots.
      validations:
          required: true
    - type: textarea
      attributes:
          label: Additional information
          description: Tell us anything else you think we should know.
